apiVersion: v1
kind: Service
metadata:
  labels:
    owner: josta
  name: webapp-svc
  namespace: josta
spec:
  internalTrafficPolicy: Local
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 8443
    protocol: TCP
    targetPort: webapp-port
  selector:
    owner: josta
    app: webapp
  sessionAffinity: None
  type: ClusterIP
